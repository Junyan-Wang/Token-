name: Token 价格监测

on:
  schedule:
    # UTC 时间，每 4 小时的第 23 分钟跑一次、跳过凌晨（北京时间 08:23/12:23/16:23/20:23）
    # 对应 UTC 00/04/08/12 点 23 分；GitHub 定时任务有 5~30 分钟随机延迟属正常
    - cron: "23 0,4,8,12 * * *"
  workflow_dispatch: {}   # 允许在 Actions 页面手动点按钮触发

permissions:
  contents: write         # 允许把 state.json 写回仓库（去重用）

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      # 提前 opt-in 到 Node 24：GitHub 将于 2026-09-16 从 runner 移除 Node 20
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行监控
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor.py

      - name: 保存监控状态（价格快照）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update price snapshot [skip ci]"
          git push
